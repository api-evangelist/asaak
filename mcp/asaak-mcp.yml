generated: '2026-07-18'
method: searched
status: published
source: https://www.asaak.com/llms.txt
notes: >-
  Asaak's marketing site (www.asaak.com) is built on Wix and exposes the Wix
  Site MCP server. This is a site-content / business-solutions MCP endpoint (not
  a first-party lending/API product server); it lets agents read public site
  information, search installed Wix business-solution APIs, and act on a
  visitor's behalf. No authentication is required to connect; only public
  information is exposed.
server:
  name: asaak-site
  vendor: Wix Site MCP
  transport: http
  url: https://www.asaak.com/_api/mcp
  authentication: none
  docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information.
    parameters: [searchTerm]
  - name: SearchSiteApiDocs
    description: >-
      Retrieves the API documentation for the Wix business solutions installed on this
      site and informs the AI client how to use the APIs. Use for querying products/services.
    parameters: [searchTerm]
  - name: GenerateVisitorToken
    description: >-
      Creates a new visitor session and obtains a visitor access token for the site.
      Must be called before any CallWixSiteAPI request if no visitor token exists.
  - name: CallWixSiteAPI
    description: >-
      Calls API methods on the site to perform actions on a visitor's behalf, such as
      querying site data, booking an appointment, or starting a purchase.
    parameters: [visitorToken, url, method, body]
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal.
    parameters: [articleUrl]
  - name: ReadFullDocsMethodSchema
    description: >-
      Fetches the full schema for a Wix API method. Should be called before calling
      the actual method via CallWixSiteAPI.
    parameters: [articleUrl]
capabilities:
  - Get business details (contact info, location, hours)
  - Discover products and services on offer
  - Book services and make reservations
  - Start a purchase and be directed to the site to complete checkout
  - Ask questions and get relevant answers without browsing the site
