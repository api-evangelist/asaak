aid: asaak
name: Asaak
description: >-
  Asaak is an East African fintech company, headquartered in Kampala, Uganda,
  that provides asset financing and working capital to small businesses and
  individual entrepreneurs who are underserved by traditional banks. Its core
  products are loans for boda boda motorcycles, fuel, and smartphones, delivered
  through a mobile-first application with a simple four-step flow of apply,
  qualify, receive financing, and repay to build credit. Asaak operates branches
  across Uganda (Kampala, Jinja, Mukono, Matugga, Nabbingo, Fort Portal, Gulu,
  and Soroti) and is a 500 Global portfolio company. It runs a backend admin
  platform at api.asaak.net and a Wix-hosted marketing site that exposes a live
  Model Context Protocol (MCP) endpoint for agentic access to public site
  content. Asaak does not currently publish a public developer API or OpenAPI.
